server:
  port: 8003

spring:
  application:
    name: 03-日志管理
  profiles:
    active: dev
  output:
    ansi:
      enabled: always  # 强制输出 ANSI 颜色（重定向到文件/管道时也保留）

logging:
  pattern:
    console: '%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){red} %clr([%thread]){red} %clr(%-5level) %clr(%logger{36}){cyan} [%X{traceId}] - %msg%n'

banner:
  location: classpath:banner.txt
  charset: UTF-8
main:
  banner-mode: console
